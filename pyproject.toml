[build-system]
requires = ["uv_build <= 0.11.32"]
build-backend = "uv_build"

[tool.uv.build-backend]
src-layout = true
module-name = "mw4"
module-root = "src"
package-data = ["data/**/*.*"]

[project]
name = "mountwizzard4"
version = "4.0.0b35"
license = "Apache-2.0"
description = "Tool for managing 10_micron mounts"
readme = "README.rst"
authors = [
    {name = "Michael Wuertenberger", email = "michael@wuertenberger.org"}
]
requires-python = ">=3.12,<3.15"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: MacOS X",
    "Environment :: Other Environment",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Utilities",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Natural Language :: English",
    "Natural Language :: German",
    "Topic :: Documentation :: Sphinx"
]

dependencies = [
    "numpy>=2.5.3,<3",
    "opencv-python-headless>=5.0.0.93,<6",
    "scipy>=1.18.1,<2",
    "astropy>=8.0.1,<9",
    "pyerfa>=2.0.1.5,<3",
    "astroquery>=0.4.11,<0.5",
    "indipyclient>=0.9.3,<0.10",
    "photutils>=3.0.0,<4",
    "pyqtgraph>=0.14.0,<0.15",
    "qimage2ndarray>=1.10.0,<2",
    "skyfield>=1.55,<2",
    "sgp4>=2.27,<3",
    "alpyca>=3.1.3,<4",
    "requests>=2.34.2,<3",
    "python-dateutil>=2.9.0.post0,<3",
    "pylnk3>=0.4.3,<0.5",
    "ping3==5.1.6",
    "wakeonlan>=4.0.0,<5",
    "pybase64==1.5.1",
    "websocket-client>=1.9.2,<2",
    "hidapi>=0.15.0,<0.16",
    "range-key-dict>=1.1.0,<2",
    "packaging>=26.3,<27",
    "lz4>=4.4.5,<5",
    "xisf>=0.9.7,<0.10",
    "pyside6>=6.11.2,<6.12",
    "pyyaml>=6.0.3,<7",
    "pywin32>=312; platform_system == 'Windows'",
]

[project.scripts]
mw4 = "mw4.cli:run"
MW4 = "mw4.cli:run"
mw = "mw4.cli:run"
MW = "mw4.cli:run"
mountwizzard4 = "mw4.cli:run"
MountWizzard4 = "mw4.cli:run"

[project.urls]
Documentation = "https://mworion.github.io/MountWizzard4"
Source = "https://github.com/mworion/mountwizzard4"
BugTracker = "https://github.com/mworion/mountwizzard4/issues"
Discussions = "https://github.com/mworion/MountWizzard4/discussions"
Channel = "https://www.youtube.com/user/orion49m/featured"
Forum = "https://forum.10micron.cloud/"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "pytest-xvfb==3.1.1",
    "pytest-env==1.7.1",
    "invoke==2.2.1",
    "ruff==0.16.10",
    "pyrefly==1.3.2",
    "coverage==7.16.2",
    "scipy-stubs==1.18.1.1",
    "fabric==3.2.3",
    "coverage-conditional-plugin==0.9.0",
]

[tool.pytest.ini_options]
minversion = "9.0"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-p", "no:cacheprovider", "--dist=loadfile"]
qt_api = "pyside6"
filterwarnings = [
    "ignore::DeprecationWarning",
    "error::DeprecationWarning:mw4",
]
markers = [
    "slow: marks tests that are intentionally slow (deselect with -m 'not slow')",
    "gui: marks tests that require a running Qt application",
    "logic: marks tests for business-logic modules only",
    "base: marks tests for base framework utilities",
    "integration: marks tests requiring external resources or real file I/O",
]

[tool.coverage.run]
source = ["src/mw4/"]
omit = ["src/mw4/gui/widgets/**/*.py"]
plugins = ["coverage_conditional_plugin"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.coverage_conditional_plugin.rules]
'if platform\.system\(\) == "Windows":' = "platform_system != 'Windows'"

[tool.coverage.coverage_conditional_plugin.omit]
"platform_system != 'Windows'" = [
    "src/mw4/base/ascomClass.py",
    "src/mw4/logic/camera/cameraAscom.py",
]

[tool.ruff]
line-length = 95
indent-width = 4
exclude = ["src/mw4/gui/widgets/*"]

[tool.ruff.lint]
extend-select = [
    "E", "T2", "UP", "I", "C", "LOG", "W", "SIM", "A", "RUF", "B", "BLE"
]
ignore = ["N999"]  # camelCase module names are the project convention

[tool.ruff.lint.per-file-ignores]
# driver boundary: alpyca / COM can raise anything; handleDeviceError classifies it
"src/mw4/base/alpacaAscomCommon.py" = ["BLE001"]
# worker boundary: nothing may escape into the pool thread (busy flag release)
"src/mw4/base/tpool.py" = ["BLE001"]

[tool.ruff.lint.isort]
no-sections = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyrefly]
# type checker (rec 10 / P4); run with `uv run pyrefly check`
project-includes = ["src/mw4"]
project-excludes = ["src/mw4/gui/widgets/**"]
python-version = "3.12"

