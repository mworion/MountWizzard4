# MountWizzard4 - Python-based tool for interacting with 10micron mounts
# SPDX-License-Identifier: Apache-2.0
# Copyright (c) 2019-2026 mworion
[build-system]
requires = ["uv_build <= 0.11.32"]
build-backend = "uv_build"

[tool.uv.build-backend]
src-layout = true
module-name = "mw4"
module-root = "src"
package-data = ["data/**/*.*"]

[project]
name = "mountwizzard4"
version = "4.0.0b37"
license = "Apache-2.0"
description = "Tool for managing 10_micron mounts"
readme = "README.rst"
authors = [
    {name = "Michael Wuertenberger", email = "michael@wuertenberger.org"}
]
requires-python = ">=3.12,<3.16"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Other Environment",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Utilities",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Natural Language :: English",
    "Natural Language :: German",
    "Topic :: Documentation :: Sphinx"
]

dependencies = [
    "numpy==2.5.4",
    "opencv-python-headless>=5.0.0.93,<6",
    "scipy>=1.18.1,<2",
    "astropy==8.0.2",
    "pyerfa>=2.0.1.5,<3",
    "astroquery>=0.4.11,<0.5",
    "indipyclient==0.9.4",
    "photutils==3.1.1",
    "pyqtgraph>=0.14.0,<0.15",
    "qimage2ndarray>=1.10.0,<2",
    "skyfield>=1.55,<2",
    "sgp4>=2.27,<3",
    "alpyca>=3.1.3,<4",
    "requests>=2.34.2,<3",
    "python-dateutil>=2.9.0.post0,<3",
    "pylnk3>=0.4.3,<0.5",
    "ping3==5.1.6",
    "wakeonlan>=4.0.0,<5",
    "pybase64==1.5.1",
    "websocket-client>=1.9.2,<2",
    "hidapi>=0.15.0,<0.16",
    "range-key-dict>=1.1.0,<2",
    "packaging>=26.3,<27",
    "lz4>=4.4.5,<5",
    "xisf>=0.9.7,<0.10",
    "pyside6==6.12.0",
    "pyyaml>=6.0.3,<7",
    "pywin32>=312; platform_system == 'Windows'",
]

[project.scripts]
mw4 = "mw4.cli:run"
mountwizzard4 = "mw4.cli:run"

[project.urls]
Documentation = "https://mworion.github.io/MountWizzard4"
Source = "https://github.com/mworion/mountwizzard4"
BugTracker = "https://github.com/mworion/mountwizzard4/issues"
Discussions = "https://github.com/mworion/MountWizzard4/discussions"
Channel = "https://www.youtube.com/user/orion49m/featured"
Forum = "https://forum.10micron.cloud/"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "pytest-xvfb==3.1.1",
    "pytest-env==1.8.1",
    "invoke==2.2.1",
    "ruff==0.17.2",
    "pyrefly==1.4.0",
    "coverage==7.17.0",
    "scipy-stubs==1.18.1.1",
    "fabric==3.2.3",
    "coverage-conditional-plugin==0.9.0",
    "import-linter==2.15",
]

[tool.importlinter]
root_package = "mw4"
include_external_packages = true
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Layers: gui > logic > mountcontrol > base"
type = "layers"
layers = ["mw4.gui", "mw4.logic", "mw4.mountcontrol", "mw4.base"]

[[tool.importlinter.contracts]]
name = "Controllers do not import drivers"
type = "forbidden"
source_modules = ["mw4.logic.controllers"]
forbidden_modules = ["mw4.logic.drivers"]

[[tool.importlinter.contracts]]
name = "Drivers do not import controllers"
type = "forbidden"
source_modules = ["mw4.logic.drivers"]
forbidden_modules = ["mw4.logic.controllers"]

[[tool.importlinter.contracts]]
name = "Controller areas are independent"
type = "independence"
modules = [
    "mw4.logic.controllers.image",
    "mw4.logic.controllers.imageWindow",
    "mw4.logic.controllers.model",
    "mw4.logic.controllers.mount",
    "mw4.logic.controllers.satellites",
]

[[tool.importlinter.contracts]]
name = "Foundations do not import drivers or controllers"
type = "forbidden"
source_modules = [
    "mw4.logic.fits",
    "mw4.logic.profiles",
    "mw4.logic.file",
    "mw4.logic.databaseProcessing",
]
forbidden_modules = ["mw4.logic.drivers", "mw4.logic.controllers"]

[[tool.importlinter.contracts]]
name = "Foundations are Qt free"
type = "forbidden"
source_modules = ["mw4.logic.fits", "mw4.logic.profiles", "mw4.logic.databaseProcessing"]
forbidden_modules = ["PySide6"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Controllers are Qt free except workers"
type = "forbidden"
source_modules = ["mw4.logic.controllers"]
forbidden_modules = ["PySide6"]
allow_indirect_imports = true
ignore_imports = [
    # QObject workers with signals, not GUI code
    "mw4.logic.controllers.imageWindow.photometry -> PySide6",
    "mw4.logic.controllers.model.modelRun -> PySide6",
]

[tool.pytest.ini_options]
minversion = "9.0"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-p", "no:cacheprovider", "--dist=loadfile"]
qt_api = "pyside6"
filterwarnings = [
    "ignore::DeprecationWarning",
    "error::DeprecationWarning:mw4",
]
markers = [
    "slow: marks tests that are intentionally slow (deselect with -m 'not slow')",
    "gui: marks tests that require a running Qt application",
    "logic: marks tests for business-logic modules only",
    "base: marks tests for base framework utilities",
    "integration: marks tests requiring external resources or real file I/O",
]

[tool.coverage.run]
branch = true
source = ["src/mw4/"]
omit = ["src/mw4/gui/widgets/**/*.py"]
plugins = ["coverage_conditional_plugin"]

[tool.coverage.report]
fail_under = 100
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.coverage_conditional_plugin.rules]
'if platformInfo\.IS_WINDOWS:' = "platform_system != 'Windows'"

[tool.coverage.coverage_conditional_plugin.omit]
"platform_system != 'Windows'" = [
    "src/mw4/logic/drivers/frameworks/ascomClass.py",
    "src/mw4/logic/drivers/camera/cameraAscom.py",
]

[tool.ruff]
line-length = 100
indent-width = 4
exclude = ["src/mw4/gui/widgets/*"]

[tool.ruff.lint]
extend-select = [
    "E", "T2", "UP", "I", "C", "LOG", "W", "SIM", "A", "RUF", "B", "BLE",
    "G004", "S113", "PLR0915", "TID251"
]
ignore = ["N999"]  # camelCase module names are the project convention

[tool.ruff.lint.pylint]
max-statements = 40

[tool.ruff.lint.per-file-ignores]
# driver boundary: alpyca / COM can raise anything; handleDeviceError classifies it
"src/mw4/logic/drivers/frameworks/alpacaAscomCommon.py" = ["BLE001"]
# worker boundary: nothing may escape into the pool thread (busy flag release)
"src/mw4/base/tpool.py" = ["BLE001"]
# the only module allowed to ask the operating system
"src/mw4/base/platformInfo.py" = ["TID251"]
# declarative: dialog widget setup, attribute lists, field-by-field response parser
"src/mw4/gui/utilities/nativeQt/qtMessageDialog.py" = ["PLR0915"]
"src/mw4/logic/controllers/imageWindow/photometry.py" = ["PLR0915"]
"src/mw4/mountcontrol/setting.py" = ["PLR0915"]
# Qt widgets / gui types are allowed in the gui, the application entry points and tests
"src/mw4/gui/**" = ["TID251"]
"src/mw4/mainApp.py" = ["TID251"]
"src/mw4/loader.py" = ["TID251"]
"tests/**" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"platform.system".msg = "Use the constants in mw4.base.platformInfo instead."
"PySide6.QtWidgets".msg = "Widgets belong in mw4.gui."
"PySide6.QtGui".msg = "GUI types belong in mw4.gui."
"PySide6.QtCharts".msg = "Charts belong in mw4.gui."

[tool.ruff.lint.isort]
no-sections = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyrefly]
# type checker (rec 10 / P4); run with `uv run pyrefly check`
project-includes = ["src/mw4"]
project-excludes = ["src/mw4/gui/widgets/**"]
python-version = "3.12"
replace-imports-with-any = ["pythoncom", "win32com.*", "hid"]

# per-path error kinds dominated by numpy / skyfield / astropy / Qt stub limits
[[tool.pyrefly.sub-config]]
matches = "src/mw4/mountcontrol/**"
[tool.pyrefly.sub-config.errors]
bad-argument-type = false
unsupported-operation = false
bad-assignment = false
no-matching-overload = false
bad-return = false

[[tool.pyrefly.sub-config]]
matches = "src/mw4/logic/**"
[tool.pyrefly.sub-config.errors]
bad-argument-type = false
unsupported-operation = false
no-matching-overload = false
bad-index = false
not-iterable = false
bad-return = false

[[tool.pyrefly.sub-config]]
matches = "src/mw4/base/**"
[tool.pyrefly.sub-config.errors]
bad-assignment = false
no-matching-overload = false

[[tool.pyrefly.sub-config]]
matches = "src/mw4/gui/**"
[tool.pyrefly.sub-config.errors]
not-callable = false
no-matching-overload = false
unsupported-operation = false

